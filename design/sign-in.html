<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Lungisa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#f9f8f6}
a{color:#2b3a8c}a:hover{color:#212d6e}
a:focus-visible,input:focus-visible{outline:2px solid #2b3a8c;outline-offset:2px}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #f9f8f6; color: #1b1e33; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-variant-numeric: lining-nums">

<header style="background: #ffffff; border-bottom: 1px solid #e6e3dc">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; min-height: 64px">
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em">Lungisa</p>
</div>
</header>

<main style="max-width: 440px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 24px">
<form aria-labelledby="signin-heading" style="background: #ffffff; border: 1px solid #e6e3dc; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 id="signin-heading" style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.01em">Sign in</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #5a5d70">We’ll email you a link. No password to remember.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="signin-email" style="font-size: 14px; line-height: 20px; font-weight: 500">Work email</label>
<input id="signin-email" type="email" autocomplete="email" placeholder="you@yourcafe.co.za" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 12px; border: 1px solid #8c8e9c; border-radius: 10px; background: #ffffff; color: #1b1e33; font-family: inherit; font-size: 16px">
</div>
<a href="check-email.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; background: #2b3a8c; color: #ffffff; font-size: 16px; font-weight: 500; text-decoration: none">Send sign-in link</a>
<p style="margin: 0; padding-top: 16px; border-top: 1px solid #e6e3dc; font-size: 14px; line-height: 20px; color: #5a5d70">New to Lungisa? Email [address] to join the pilot.</p>
</form>
<p style="margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: #5a5d70">Getting people hired, and helping them stay.</p>
</main>
</div>
</body>
</html>
