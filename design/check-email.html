<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#f9f8f6}
a{color:#2b3a8c}a:hover{color:#212d6e}
a:focus-visible,button:focus-visible{outline:2px solid #2b3a8c;outline-offset:2px}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #f9f8f6; color: #1b1e33; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-variant-numeric: lining-nums">

<header style="background: #ffffff; border-bottom: 1px solid #e6e3dc">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; min-height: 64px">
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em">Lungisa</p>
</div>
</header>

<main style="max-width: 440px; margin: 0 auto; padding: 80px 24px">
<div style="background: #ffffff; border: 1px solid #e6e3dc; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2b3a8c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.01em">Check your email</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #5a5d70">We’ve sent a sign-in link to [email address]. It works once and expires in [X] minutes.</p>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; border: 1px solid #8c8e9c; border-radius: 10px; background: #ffffff; color: #1b1e33; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">Send another link</button>
<p style="margin: 0; padding-top: 16px; border-top: 1px solid #e6e3dc; font-size: 14px; line-height: 20px; color: #5a5d70">Not there? Check your spam folder, or <a href="sign-in.html" style="font-weight: 500; color: #2b3a8c; text-decoration: none">use a different email</a>.</p>
</div>
</main>
</div>
</body>
</html>
